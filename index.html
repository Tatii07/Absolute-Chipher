<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Cipher</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tema.css">
    <link rel="stylesheet" href="arbol_habilidades.css">
</head>
<body class="modo-menu">

    <!-- CONTENEDOR PRINCIPAL DEL JUEGO -->
    <div id="game-container">

<!-- VENTANA MODAL PERSONALIZADA -->
<div id="modal-aviso" class="modal-fondo oculto">
    <div class="modal-caja">
        <p id="modal-texto"></p>
        <button onclick="cerrarModal()" class="boton-opcion boton-primario">Aceptar</button>
    </div>
</div>

        <!-- 1. CAJA SUPERIOR: HUD / Estado del jugador -->
        <header id="caja-hud" class="caja-ui oculto">
            <div class="hud-superior">
                <div class="hud-celda">
                    <span class="hud-etiqueta">Nivel</span>
                    <span id="ui-nivel">1</span>
                </div>
                <div class="hud-celda hud-vida">
                    <span class="hud-etiqueta">Vida</span>
                    <span><span id="ui-hp">50</span> / <span id="ui-hp-max">50</span></span>
                    <div class="barra"><div id="ui-hp-barra" class="barra-relleno"></div></div>
                </div>
                <div class="hud-celda hud-mana">
                    <span class="hud-etiqueta">Maná</span>
                    <span><span id="ui-mp">40</span> / <span id="ui-mp-max">40</span></span>
                    <div class="barra barra-mana"><div id="ui-mp-barra" class="barra-relleno"></div></div>
                </div>
                <div class="hud-celda">
                    <span class="hud-etiqueta">Oro</span>
                    <span>🪙 <span id="ui-oro">0</span></span>
                </div>
                <button id="btn-menu-fijo" onclick="abrirMenuOpciones()" class="boton-opcion boton-hud oculto">⚙️ Menú</button>
            </div>
        </header>

        <!-- 2. CAJA CENTRAL: Historia, Texto e Inventario -->
        <main id="caja-narrativa" class="caja-ui">
            
            <!-- Bloque exclusivo del Menú Principal -->
            <div id="bloque-menu-inicio">
                <img src="img/logo_menu.png" alt="Absolute Cipher: RPG de texto" class="logo-juego">
                <h1 id="menu-inicio" class="titulo-juego titulo-oculto">Absolute Cipher</h1>
                <p id="version">Versión de prueba 0.1</p>
            </div>

            <!-- Texto de la Historia (Dinámico para el juego) -->
            <div id="texto-historia"></div>

            <!-- Pantalla del inventario -->
            <div id="pantalla-inventario" class="oculto"></div>
        </main>

        <!-- 3. CAJA INFERIOR: Botones de opciones y acciones -->
        <!-- 3. CAJA INFERIOR: Botones de opciones y acciones -->
        <footer id="caja-acciones" class="caja-ui">
            <div class="opciones-container"></div>
            <div style="display: flex; gap: 10px; width: 100%; justify-content: center;">
                <button id="btn-mochila-fijo" class="oculto btn-accion-extra" onclick="abrirPantallaInventario()">🎒 Mochila</button>
                <button id="btn-stats-fijo" class="oculto btn-accion-extra" onclick="abrirPantallaStats()">📊 Personaje</button>
            </div>
        </footer>
        
<audio id="musica-fondo" loop>
    <source src="audio/menu_principal.mp3" type="audio/mpeg">
    Tu navegador no soporta audio HTML5.
</audio>


    </div>

   <!---SCRIPTS ESCENAS <--></-->

<script src="base_datos/equipamiento.js"></script>
<script src="base_datos/enemigos.js"></script>
<script src="base_datos/rasgos.js"></script>
<script src="base_datos/razas.js"></script>
<script src="base_datos/clases.js"></script>
<script src="base_datos/habilidades.js"></script>

</script>
    
    <!-- SCRIPTS -->
    <script src="compañeros.js"></script>
    <script src="jugador.js"></script>
    <script src="inventario.js"></script> 
    <script src="equipo.js"></script>
    <script src="sistema_razas.js"></script>
    <script src="sistema_clases.js"></script>
    <script src="sistema_habilidades.js"></script>
    <script src="sistemas.js"></script>
    <script src="misiones.js"></script>
    <script src="ui.js"></script> 
    <script src="script.js"></script>   
    <script src="admin.js"></script>
    <script src="combate.js"></script>
    <script src="creacion.js"></script>
    <script src="audio.js"></script>
</body>
</html>
