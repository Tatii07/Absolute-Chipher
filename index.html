<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Por Decidir</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="juego.css">
</head>
<body class="modo-menu">

    <!-- CONTENEDOR PRINCIPAL DEL JUEGO -->
    <div id="game-container">

<!-- VENTANA MODAL PERSONALIZADA -->
<div id="modal-aviso" class="oculto" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 100;">
    <div style="background: #0f172a; border: 2px solid #c9a050; padding: 20px; border-radius: 10px; width: 80%; max-width: 280px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.8);">
        <p id="modal-texto" style="color: #f8fafc; font-size: 14px; margin-bottom: 20px; font-family: 'Cinzel', serif;"></p>
        <button onclick="cerrarModal()" class="boton-opcion" style="width: 100%;">Aceptar</button>
    </div>
</div>

<button id="btn-menu-fijo" onclick="abrirMenuOpciones()" class="boton-opcion oculto" style="position: fixed; top: 10px; right: 10px; z-index: 100; padding: 6px 12px; font-size: 12px; background: #1e293b; border-color: #475569;">⚙️ Menú</button>



        <!-- 1. CAJA SUPERIOR: HUD / Estado del jugador -->
        <header id="caja-hud" class="caja-ui oculto">
            <div class="hud-superior">
                <span>Nivel: <span id="ui-nivel">1</span></span>
                <span>HP: <span id="ui-hp">50</span>/<span id="ui-hp-max">50</span></span>
                <span>🪙 <span id="ui-oro">0</span></span>
            </div>
        </header>

        <!-- 2. CAJA CENTRAL: Historia, Texto e Inventario -->
        <main id="caja-narrativa" class="caja-ui">
            
            <!-- Bloque exclusivo del Menú Principal -->
            <div id="bloque-menu-inicio" style="text-align: center; width: 100%;">
                <div id="menu-inicio" style="font-size: 24px; color: #f3e5ab; font-weight: bold; margin-bottom: 8px;">Por Decidir</div>
                <p class="subtitulo" style="color: #94a3b8; font-style: italic; margin-bottom: 15px;">No Se</p>
                <p id="version" style="font-size: 12px; color: #64748b; margin-bottom: 20px;">Versión De Prueba 0.0</p>
            </div>

            <!-- Texto de la Historia (Dinámico para el juego) -->
            <div id="texto-historia"></div>

            <!-- Pantalla del inventario -->
            <div id="pantalla-inventario" class="oculto"></div>
        </main>

        <!-- 3. CAJA INFERIOR: Botones de opciones y acciones -->
        <!-- 3. CAJA INFERIOR: Botones de opciones y acciones -->
        <footer id="caja-acciones" class="caja-ui">
            <div class="opciones-container"></div>
            <div style="display: flex; gap: 10px; width: 100%; justify-content: center;">
                <button id="btn-mochila-fijo" class="oculto btn-accion-extra" onclick="abrirPantallaInventario()">🎒 Mochila</button>
                <button id="btn-stats-fijo" class="oculto btn-accion-extra" onclick="abrirPantallaStats()">📊 Personaje</button>
            </div>
        </footer>


    </div>

   <!---SCRIPTS ESCENAS <--></-->
    <!-- Cambiar esto: -->
<script src="ubicaciónes/menu.js"></script>
<script src="ubicaciónes/mina.js"></script>


    <!-- SCRIPTS -->
    <script src="compañeros.js"></script>
    <script src="jugador.js"></script>
    <script src="inventario.js"></script> 
    <script src="base_datos.js"></script>
    <script src="sistemas.js"></script>
    <script src="misiones.js"></script>
    <script src="ui.js"></script> 
    <script src="script.js"></script>   
    <script src="admin.js"></script>
    <script src="combate.js"></script>
</body>
</html>
